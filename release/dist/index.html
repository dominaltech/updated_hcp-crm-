<!DOCTYPE html>

<head>

  <link rel="shortcut icon" href="/HCP_New_Logo_Png_witought-name-removebg.png">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('hcp_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark-theme');
        }
      } catch (e) {}
    })();
  </script>
