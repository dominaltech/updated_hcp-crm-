<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HCP Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="supabase.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --border-focus: #c5a880;
      --text: #0f172a;
      --text-muted: #64748b;
      --gold: #b38e5d;
      --gold-dark: #967243;
      --gold-light: #fbf7ee;
      --gold-border: #e5d7be;
      --green: #10b981;
      --green-bg: #ecfdf5;
      --red: #ef4444;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 24px;
    }

    /* Centered Minimal Header */
    /* Centered Minimal Header */
    .top-header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px 8px;
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
      width: 100%;
    }

    .brand-center {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* Modern Segmented Button Tabs */
    .nav-tabs {
      display: flex;
      width: 100%;
      background: #f1f5f9;
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: 12px;
      gap: 6px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-btn.active {
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.22);
      font-weight: 700;
    }

    .tab-count {
      background: #e2e8f0;
      color: #475569;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      transition: all 0.2s;
    }

    .tab-btn.active .tab-count {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    /* Main Container - Full Width Modern Layout */
    main {
      padding: 10px 12px;
      max-width: 100%;
      width: 100%;
      margin: 0;
      flex: 1;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Clean Card */
    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    .form-input {
      width: 100%;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus {
      background: #ffffff;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(179, 142, 93, 0.12);
    }

    /* Custom Vendor Dropdown Box with Pencil Icon */
    .custom-select-box {
      display: flex;
      align-items: center;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      position: relative;
      transition: all 0.2s;
    }

    .custom-select-box:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(179, 142, 93, 0.12);
      background: #ffffff;
    }

    .select-display {
      flex: 1;
      padding: 11px 13px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }

    .select-arrow {
      color: var(--gold);
      font-size: 11px;
      margin-right: 6px;
    }

    .pencil-btn {
      background: none;
      border: none;
      border-left: 1px solid var(--border);
      padding: 10px 14px;
      color: var(--gold-dark);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .pencil-btn:active {
      background: var(--gold-light);
    }

    /* Date Box in Our Theme */
    .custom-date-box {
      display: flex;
      align-items: center;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      cursor: pointer;
      user-select: none;
      justify-content: space-between;
      transition: all 0.2s;
    }

    .custom-date-box:active {
      background: var(--gold-light);
      border-color: var(--border-focus);
    }

    .date-display-val {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }

    .date-display-icon {
      color: var(--gold);
      font-size: 16px;
    }

    /* Amount Input */
    .amount-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .currency-tag {
      position: absolute;
      left: 14px;
      color: var(--gold-dark);
      font-size: 20px;
      font-weight: 700;
      pointer-events: none;
    }

    .amount-input {
      padding-left: 36px !important;
      font-size: 22px !important;
      font-weight: 700 !important;
      color: var(--text) !important;
      letter-spacing: 0.5px;
    }

    .amount-words-text {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
      padding-left: 2px;
      min-height: 16px;
    }

    /* GST Toggle: Only With GST & Without GST */
    .gst-switch-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .gst-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 11px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .gst-btn.active {
      background: var(--gold-light);
      border-color: var(--gold);
      color: var(--gold-dark);
      box-shadow: 0 1px 4px rgba(179, 142, 93, 0.15);
    }

    /* Payment Modes */
    .payment-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .pay-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .pay-card .icon {
      font-size: 22px;
    }

    .pay-card .text {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .pay-card.active {
      background: var(--gold-light);
      border-color: var(--gold);
      box-shadow: 0 1px 4px rgba(179, 142, 93, 0.15);
    }

    .pay-card.active .text {
      color: var(--gold-dark);
      font-weight: 700;
    }

    /* Save Button */
    .btn-save-main {
      background: linear-gradient(135deg, #c5a880 0%, #b38e5d 100%);
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(179, 142, 93, 0.3);
      transition: all 0.15s ease;
      margin-top: 4px;
    }

    .btn-save-main:active {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(179, 142, 93, 0.2);
    }

    .btn-save-main:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Recent Bills List */
    .bills-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bill-item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bill-item-card:active {
      background: #fafaf9;
      border-color: var(--gold);
    }

    .bill-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .bill-vendor-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .bill-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .bill-amount-display {
      font-size: 17px;
      font-weight: 700;
      color: var(--gold-dark);
      text-align: right;
    }

    .bill-card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px solid #f1f5f9;
      font-size: 11px;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-gst {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-mode {
      background: #e0f2fe;
      color: #0369a1;
    }

    .badge-status {
      background: #f1f5f9;
      color: #475569;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.show {
      display: flex;
      animation: fadeIn 0.18s ease;
    }

    .modal-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 10px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .modal-close-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-secondary {
      flex: 1;
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      flex: 1;
      background: var(--gold);
      border: none;
      color: #ffffff;
      padding: 10px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-danger {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      padding: 10px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Custom Theme Date Picker Modal */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }

    .calendar-day-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 6px 0;
    }

    .calendar-day-cell {
      padding: 9px 0;
      font-size: 14px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text);
      transition: all 0.1s;
    }

    .calendar-day-cell:hover, .calendar-day-cell:active {
      background: var(--gold-light);
    }

    .calendar-day-cell.selected {
      background: var(--gold);
      color: #ffffff;
      font-weight: 700;
    }

    .calendar-day-cell.other-month {
      color: #cbd5e1;
    }

    .calendar-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .calendar-nav-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* Vendor Selection List in Modal */
    .vendor-picker-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
    }

    .vendor-picker-item {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .vendor-picker-item.selected {
      border-color: var(--gold);
      background: var(--gold-light);
      color: var(--gold-dark);
    }

    /* Toast */
    .toast-box {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      color: #ffffff;
      padding: 11px 20px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      z-index: 200;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .toast-box.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Bill Details Key-Value */
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
    }

    .detail-label {
      color: var(--text-muted);
    }

    .detail-value {
      font-weight: 600;
      color: var(--text);
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 13px;
    }
  
    /* Compact Single-Screen Add Bill Optimization */
    #tabAdd .form-card {
      padding: 10px 14px;
      gap: 6px;
    }
    #tabAdd .form-group {
      margin-bottom: 6px;
    }
    #tabAdd .form-label {
      font-size: 11px;
      margin-bottom: 2px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    #tabAdd .form-input, #tabAdd .select-display, #tabAdd .custom-date-box {
      padding: 7px 10px;
      font-size: 13px;
    }
    #tabAdd .amount-box .currency-tag {
      font-size: 17px;
      left: 10px;
    }
    #tabAdd .amount-input {
      padding-left: 28px !important;
      font-size: 18px !important;
      padding-top: 5px !important;
      padding-bottom: 5px !important;
    }
    #tabAdd .amount-words-text {
      font-size: 10px;
      min-height: 13px;
      padding-top: 1px;
    }
    #tabAdd .gst-btn {
      padding: 7px 6px;
      font-size: 12px;
    }
    #tabAdd .pay-card {
      padding: 7px 4px;
      gap: 3px;
    }
    #tabAdd .pay-card .icon {
      font-size: 16px;
    }
    #tabAdd .pay-card .text {
      font-size: 11px;
    }
    #tabAdd .btn-save-main {
      padding: 10px 16px;
      font-size: 14px;
      margin-top: 4px;
    }

    /* Sub Tabs for Recent Bills: Bill Wise & Party Wise */
    .sub-nav-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .sub-tab-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .sub-tab-btn.active {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.2);
    }

    /* Party-Wise Card Styling */
    .party-group-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .party-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 8px;
    }
    .party-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
    }
    .party-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .party-totals {
      text-align: right;
    }
    .party-total-amt {
      font-size: 16px;
      font-weight: 800;
      color: var(--gold-dark);
    }
    .party-bills-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Status Color Coding for Party Wise Bills */
    .status-card-full {
      background: #ecfdf5 !important;
      border: 1.5px solid #10b981 !important;
    }
    .status-badge-full {
      background: #10b981 !important;
      color: #ffffff !important;
    }
    .status-card-partly {
      background: #fffbeb !important;
      border: 1.5px solid #f59e0b !important;
    }
    .status-badge-partly {
      background: #f59e0b !important;
      color: #ffffff !important;
    }
    .status-card-unpaid {
      background: #fef2f2 !important;
      border: 1.5px solid #ef4444 !important;
    }
    .status-badge-unpaid {
      background: #ef4444 !important;
      color: #ffffff !important;
    }

    /* Distinct User-Facing Status Badges: Pending, Partially, Fully */
    .badge-status-pending {
      background: #fef2f2 !important;
      color: #dc2626 !important;
      border: 1px solid #fca5a5 !important;
      font-weight: 700 !important;
    }
    .badge-status-partially {
      background: #fffbeb !important;
      color: #b45309 !important;
      border: 1px solid #fcd34d !important;
      font-weight: 700 !important;
    }
    .badge-status-fully {
      background: #ecfdf5 !important;
      color: #047857 !important;
      border: 1px solid #6ee7b7 !important;
      font-weight: 700 !important;
    }

    /* Aging Indicators: 15-25 days Yellow, 25-40+ days Red */
    .aging-card-yellow {
      background: #fefce8 !important;
      border: 1.5px solid #eab308 !important;
    }
    .aging-badge-yellow {
      background: #fef08a !important;
      color: #854d0e !important;
      border: 1px solid #eab308 !important;
      font-weight: 700 !important;
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .aging-card-red {
      background: #fef2f2 !important;
      border: 1.5px solid #ef4444 !important;
    }
    .aging-badge-red {
      background: #fee2e2 !important;
      color: #991b1b !important;
      border: 1px solid #ef4444 !important;
      font-weight: 700 !important;
      padding: 3px 8px;

  <!-- MODAL: BILL FULL DETAILS (Open when clicked from history) -->

  <!-- Toast -->

  </div>

  <script>
    // -------------------------------------------------------------
    // HOTEL CITY PARK DEDICATED STORE DATABASE (NO OLD ADMIN NOTIFICATIONS)
    // -------------------------------------------------------------
    const SUPABASE_URL = 'https://hlwmsllmqfdxfmqulrat.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhsd21zbGxtcWZkeGZtcXVscmF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3Mzc4MzgsImV4cCI6MjEwNTMxMzgzOH0.r7Nb8rEJTrZvprpf4G023nMY0suq2OqVGetG0I8esjk';
    
    let _supabase = null;
    function getSupabaseClient() {
      if (_supabase) return _supabase;
      try {
        const sp = (typeof window !== 'undefined' && window.supabase) || (typeof supabase !== 'undefined' ? supabase : null);
        if (sp && typeof sp.createClient === 'function') {
          _supabase = sp.createClient(SUPABASE_URL, SUPABASE_ANON);
        }
      } catch (e) {
        console.warn('Supabase init warning:', e);
      }
      return _supabase;
    }
    _supabase = getSupabaseClient();

    // Ensure vendor exists in Supabase to strictly prevent Foreign Key (23503) errors
    async function getOrSyncVendorDbId(vendor) {
      const client = getSupabaseClient();
      if (!client || !vendor) return 1;

      // 1. If vendor.id is a number, verify if it actually exists in Supabase
      if (typeof vendor.id === 'number') {
        try {
          const { data: vById } = await client.from('store_vendors').select('id').eq('id', vendor.id).limit(1);
          if (vById && vById.length > 0) {
            return vById[0].id;
          }
        } catch (_) {}
      }

      // 2. Lookup existing vendor by exact or case-insensitive name
      const vName = (vendor.name || '').trim();
      if (vName) {
        try {
          const { data: vByName } = await client.from('store_vendors').select('id').ilike('name', vName).limit(1);
          if (vByName && vByName.length > 0) {
            vendor.id = vByName[0].id;
            return vByName[0].id;
          }
        } catch (_) {}
      }

      // 3. If neither exists, insert this vendor into Supabase store_vendors immediately
      try {
        const { data: newV, error: insErr } = await client.from('store_vendors').insert([{
          name: vendor.name || 'Store Vendor',
          mobile: vendor.phone || '',
          address: vendor.category || ''
        }]).select();
        if (newV && newV[0]) {
          vendor.id = newV[0].id;
          return newV[0].id;
        }
      } catch (insErr) {
        console.warn('Failed to insert vendor in Supabase:', insErr);
      }

      // 4. Fallback to any valid vendor in Supabase
      try {
        const { data: anyV } = await client.from('store_vendors').select('id').limit(1);
        if (anyV && anyV[0]) return anyV[0].id;
      } catch (_) {}

      return 1;
    }

    // -------------------------------------------------------------
    // STATE & INITIAL VENDORS
    // -------------------------------------------------------------
    const FALLBACK_VENDORS = [
      { id: 1, name: 'Gupta Grocery', phone: '9876543210', category: 'Market Road' },
      { id: 2, name: 'Sharma Dairy', phone: '9123456789', category: 'Milk Colony' },
      { id: 3, name: 'Tara mutton shop', phone: '8888888888', category: 'Mutton' }
    ];

    let vendors = [];
    let bills = [];
    let selectedVendorId = '';
    let selectedDate = new Date();
    let tempPickerDate = new Date();
    let hasGst = true;
    let selectedPaymentMode = 'Bank Transfer';
    let isSubmitting = false;

    // -------------------------------------------------------------
    // LIFECYCLE INITIALIZATION
    // -------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      loadVendors();
      loadBills();
      updateDateDisplay();
      updateBillsCounter();
      renderBillsList();

      // Realtime subscription for instant payment reflection
      try {
        const client = getSupabaseClient();
        if (client && client.channel) {
          client.channel('store_realtime_payments')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'store_bills' }, () => {
              loadBills();
            })
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'store_vendor_payments' }, (payload) => {
              loadBills();
              const amt = payload?.new?.payment_amount || 0;
              showToast(`🔔 Admin paid ₹${amt} for Store Bill!`, true);
            })
            .subscribe();
        }
      } catch (err) {
        console.warn('Realtime subscription error:', err);
      }
    });

    // -------------------------------------------------------------
    // VENDOR MANAGEMENT (Custom Dropdown + Pencil)
    // -------------------------------------------------------------
    async function loadVendors() {
      const stored = localStorage.getItem('hcp_store_vendors');
      if (stored) {
        try { vendors = JSON.parse(stored); } catch (_) { vendors = FALLBACK_VENDORS.slice(); }
      } else {
        vendors = FALLBACK_VENDORS.slice();
      }

      // Fetch live vendors from Supabase store_vendors
      try {
        const client = getSupabaseClient();
        if (client) {
          const { data, error } = await client.from('store_vendors').select('*').order('name');
          if (data && data.length > 0) {
            vendors = data.map(v => ({ id: v.id, name: v.name, phone: v.mobile || '', category: v.address || '' }));
            saveVendors();
          }
        }
      } catch (e) {
        console.warn('Vendors fetch:', e);
      }

      if (vendors.length > 0 && !selectedVendorId) {
        selectedVendorId = vendors[0].id;
      }
      updateVendorDisplay();
    }

    function saveVendors() {
      localStorage.setItem('hcp_store_vendors', JSON.stringify(vendors));
    }

    function updateVendorDisplay() {
      const v = vendors.find(x => x.id === selectedVendorId);
      const textEl = document.getElementById('selectedVendorText');
      if (v) {
        textEl.textContent = v.name;
      } else {
        textEl.textContent = 'Select Vendor';
      }
    }

    function openVendorPickerModal() {
      document.getElementById('vendorSearchInput').value = '';
      renderVendorPickerItems();
      document.getElementById('vendorPickerModal').classList.add('show');
    }

    function renderVendorPickerItems(filter = '') {
      const container = document.getElementById('vendorPickerItemsContainer');
      container.innerHTML = '';
      let list = vendors;
      if (filter) {
        const q = filter.toLowerCase();
        list = vendors.filter(v => v.name.toLowerCase().includes(q) || (v.category && v.category.toLowerCase().includes(q)));
      }

      if (list.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:16px; color:#94a3b8; font-size:13px;">No matching vendors</div>';
        return;
      }

      list.forEach(v => {
        const item = document.createElement('div');
        item.className = 'vendor-picker-item' + (v.id === selectedVendorId ? ' selected' : '');
        item.innerHTML = `
          <span>${v.name}</span>
          <span style="font-size:12px; color:#64748b;">${v.phone || ''}</span>
        `;
        item.onclick = () => {
          selectedVendorId = v.id;
          updateVendorDisplay();
          closeModal('vendorPickerModal');
        };
        container.appendChild(item);
      });
    }

    function filterVendorList() {
      const q = document.getElementById('vendorSearchInput').value.trim();
      renderVendorPickerItems(q);
    }

    function openVendorManagerModal(isAddingNew = false) {
      const v = vendors.find(x => x.id === selectedVendorId);
      const titleEl = document.getElementById('vendorManagerTitle');
      const actionsEl = document.getElementById('mgrModalActions');

      if (isAddingNew || !v) {
        titleEl.textContent = 'Add New Vendor';
        document.getElementById('mgrVendorName').value = '';
        document.getElementById('mgrVendorPhone').value = '';
        document.getElementById('mgrVendorCat').value = '';
        document.getElementById('phoneCounter').textContent = '0/10';
        actionsEl.innerHTML = `
          <button type="button" class="btn-secondary" onclick="closeModal('vendorManagerModal')">Cancel</button>
          <button type="button" class="btn-primary" onclick="saveVendorRecord(true)">Save</button>
        `;
      } else {
        titleEl.textContent = 'Edit Vendor';
        document.getElementById('mgrVendorName').value = v.name;
        document.getElementById('mgrVendorPhone').value = v.phone || '';
        document.getElementById('mgrVendorCat').value = v.category || '';
        document.getElementById('phoneCounter').textContent = `${(v.phone || '').length}/10`;
        actionsEl.innerHTML = `
          <button type="button" class="btn-danger" onclick="deleteCurrentVendor()">Delete</button>
          <button type="button" class="btn-secondary" onclick="closeModal('vendorManagerModal')">Cancel</button>
          <button type="button" class="btn-primary" onclick="saveVendorRecord(false)">Update</button>
        `;
      }
      document.getElementById('vendorManagerModal').classList.add('show');
    }

    async function saveVendorRecord(isNew) {
      const name = document.getElementById('mgrVendorName').value.trim();
      const phone = document.getElementById('mgrVendorPhone').value.trim();
      const cat = document.getElementById('mgrVendorCat').value.trim();

      if (!name) {
        showToast('Please enter vendor name', false);
        return;
      }
      if (phone && phone.length !== 10) {
        showToast('Mobile number must be strictly 10 digits', false);
        return;
      }

      if (isNew) {
        const newId = 'v_' + Date.now();
        const newObj = { id: newId, name, phone, category: cat };
        vendors.push(newObj);
        selectedVendorId = newId;

        const client = getSupabaseClient();
        if (client) {
          try {
            const { data } = await client.from('store_vendors').insert([{ name, mobile: phone, address: cat }]).select();
            if (data && data[0]) {
              newObj.id = data[0].id;
              selectedVendorId = data[0].id;
            }
          } catch (_) {}
        }
        showToast('Vendor added');
      } else {
        const v = vendors.find(x => x.id === selectedVendorId);
        if (v) {
          v.name = name;
          v.phone = phone;
          v.category = cat;
          const client = getSupabaseClient();
          if (client && typeof v.id === 'number') {
            try {
              await client.from('store_vendors').update({ name, mobile: phone, address: cat }).eq('id', v.id);
            } catch (_) {}
          }
          showToast('Vendor updated');
        }
      }
      saveVendors();
      updateVendorDisplay();
      closeModal('vendorManagerModal');
    }

    async function deleteCurrentVendor() {
      const v = vendors.find(x => x.id === selectedVendorId);
      if (!v) return;
      if (confirm(`Delete vendor "${v.name}"?`)) {
        const client = getSupabaseClient();
        if (client && typeof v.id === 'number') {
          try {
            await client.from('store_vendors').delete().eq('id', v.id);
          } catch (_) {}
        }
        vendors = vendors.filter(x => x.id !== selectedVendorId);
        if (vendors.length > 0) selectedVendorId = vendors[0].id;
        else selectedVendorId = '';
        saveVendors();
        updateVendorDisplay();
        closeModal('vendorManagerModal');
        showToast('Vendor deleted');
      }
    }

    // -------------------------------------------------------------
    // STRICT 10-DIGIT NUMERIC-ONLY PHONE NUMBER
    // -------------------------------------------------------------
    function enforceTenDigit(input, counterId) {
      let val = input.value.replace(/\D/g, '');
      if (val.length > 10) val = val.substring(0, 10);
      input.value = val;

    function renderCalendar() {

      const month = tempPickerDate.getMonth();
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      const daysInMonth = new Date(year, month + 1, 0).getDate();

    // -------------------------------------------------------------
    // INDIAN CURRENCY FORMATTING
    // -------------------------------------------------------------
    function handleAmountInput(input) {
      let val = input.value.replace(/,/g, '').replace(/\D/g, '');
      if (!val) {
        input.value = '';
        document.getElementById('amountWordsText').textContent = 'Zero Rupees';
        return;
      }

      const num = parseInt(val, 10);
      if (isNaN(num)) {
        input.value = '';
        return;
      }

      input.value = formatIndianNumber(num);
      document.getElementById('amountWordsText').textContent = numberToWords(num) + ' only';
    }

    function formatIndianNumber(x) {
      x = x.toString();
      let lastThree = x.substring(x.length - 3);
      let otherNumbers = x.substring(0, x.length - 3);
      if (otherNumbers !== '') lastThree = ',' + lastThree;
      return otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + lastThree;
    }

    function numberToWords(num) {
      if (num === 0) return 'Zero Rupees';
      const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
                 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
      const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

      function inWords(n) {
        let str = '';
        if (n >= 10000000) { str += inWords(Math.floor(n / 10000000)) + ' Crore '; n %= 10000000; }
        if (n >= 100000) { str += inWords(Math.floor(n / 100000)) + ' Lakh '; n %= 100000; }
        if (n >= 1000) { str += inWords(Math.floor(n / 1000)) + ' Thousand '; n %= 1000; }
        if (n >= 100) { str += inWords(Math.floor(n / 100)) + ' Hundred '; n %= 100; }
        if (n > 0) {
          if (n < 20) str += a[n] + ' ';
          else str += b[Math.floor(n / 10)] + ' ' + a[n % 10] + ' ';
        }
        return str.trim();
      }
      return inWords(num) + ' Rupees';
    }

    // BILL SUBMISSION (Saves to store_bills - Zero Old Admin Alerts)
    // -------------------------------------------------------------
    async function submitBill() {
      if (isSubmitting) return;

      const vendor = vendors.find(x => x.id === selectedVendorId);
      const billNumber = document.getElementById('billNumberInput').value.trim();
      const rawAmt = document.getElementById('billAmountInput').value.replace(/,/g, '').trim();
      const numAmt = parseInt(rawAmt, 10);
      const saveBtn = document.getElementById('btnSave');

      if (!vendor) {
        showToast('Please select a vendor', false);
        return;
      }
      if (!numAmt || numAmt <= 0) {
        showToast('Please enter bill amount', false);
        document.getElementById('billAmountInput').focus();
        return;
      }

      isSubmitting = true;
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<span>⏳ Saving...</span>`;

      const billId = 'BILL-' + Date.now().toString().slice(-6);
      const formattedAmt = formatIndianNumber(numAmt);
      const d = selectedDate.getDate().toString().padStart(2, '0');
      const m = (selectedDate.getMonth() + 1).toString().padStart(2, '0');
      const y = selectedDate.getFullYear();
      const dateStr = `${y}-${m}-${d}`;

      const billRecord = {
        id: billId,
        vendor_id: vendor.id,
        vendor_name: vendor.name,
        vendor_phone: vendor.phone || '',
        bill_number: billNumber || 'N/A',
        bill_date: dateStr,
        amount: numAmt,
        amount_formatted: formattedAmt,
        has_gst: hasGst,
        gst_status: hasGst ? 'With GST' : 'Without GST',
        payment_mode: selectedPaymentMode,
        status: 'PENDING',
        created_at: new Date().toISOString()
      };

      // 1. Save directly into Supabase store_bills table in real project
      try {
        const client = getSupabaseClient();
        if (client) {
          const vendorDbId = await getOrSyncVendorDbId(vendor);

          const { data: insertedData, error: insertError } = await client.from('store_bills').insert([{
            vendor_id: vendorDbId,
            bill_number: billNumber || 'N/A',
            bill_date: dateStr,
            total_amount: numAmt,
            paid_amount: 0,
            pending_amount: numAmt,
            status: 'PENDING',
            notes: `${hasGst ? 'With GST' : 'Without GST'} | Mode: ${selectedPaymentMode}`,
            created_by: 'Store Boy'
          }]).select();

          if (insertError) {
            console.error('Supabase store_bills insert error:', insertError);
            throw insertError;
          }

          // Trigger push notification to Admin APK (HotelCityPark-Owner)
          const newBillId = (insertedData && insertedData[0]) ? insertedData[0].id : '';
          const pushPayload = {
            title: '📦 Store Bill: ' + vendor.name,
            body: '₹' + formattedAmt + ' bill entered by Storeman (' + selectedPaymentMode + ' • ' + (hasGst ? 'With GST' : 'Without GST') + ')',
            type: 'store',
            data: {
              bill_id: String(newBillId),
              vendor_name: vendor.name,
              bill_number: billNumber || 'N/A',
              amount: formattedAmt,
              payment_mode: selectedPaymentMode,
              has_gst: hasGst
            }
          };

          client.functions.invoke('send-push', { body: pushPayload }).catch(pushErr => {
            console.warn('send-push notice:', pushErr);
            client.functions.invoke('send-store-push', { body: pushPayload }).catch(() => {});
          });
        }
      } catch (err) {
        console.warn('Cloud save warning (queueing offline):', err);
        // Queue for offline auto-sync
        try {
          const q = JSON.parse(localStorage.getItem('hcp_store_offline_queue') || '[]');
          q.push({
            vendor_id: vendor.id,
            vendor_name: vendor.name,
            vendor_phone: vendor.phone,
            vendor_category: vendor.category,
            bill_number: billNumber || 'N/A',
            bill_date: dateStr,
            total_amount: numAmt,
            notes: `${hasGst ? 'With GST' : 'Without GST'} | Mode: ${selectedPaymentMode}`
          });
          localStorage.setItem('hcp_store_offline_queue', JSON.stringify(q));
          showToast('Saved offline. Will sync when internet is on.', true);
        } catch (_) {}
      }

      // 2. Save locally into bills archive
      bills.unshift(billRecord);
      saveBills();
      updateBillsCounter();
      renderBillsList();

      // 3. Reset form
      document.getElementById('billNumberInput').value = '';
      document.getElementById('billAmountInput').value = '';
      document.getElementById('amountWordsText').textContent = 'Zero Rupees';

      showToast('Bill Saved');
      saveBtn.disabled = false;
      saveBtn.innerHTML = `<span>💾 Save</span>`;
      isSubmitting = false;

      // Switch to Recents tab to review
      setTimeout(() => switchTab('recent'), 500);
    }

    function formatDateTime(dateStr) {
      if (!dateStr) return 'N/A';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        const day = d.getDate().toString().padStart(2, '0');
        const month = (d.getMonth() + 1).toString().padStart(2, '0');
        const year = d.getFullYear();
        let hours = d.getHours();
        const minutes = d.getMinutes().toString().padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        return `${day}/${month}/${year} at ${hours}:${minutes} ${ampm}`;
      } catch (_) {
        return dateStr;
      }
    }

    function formatDateOnly(dateStr) {
      if (!dateStr) return 'N/A';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        const day = d.getDate().toString().padStart(2, '0');
        const month = (d.getMonth() + 1).toString().padStart(2, '0');
        const year = d.getFullYear();
        return `${day}/${month}/${year}`;
      } catch (_) {
        return dateStr;
      }
    }

    function getBillAging(billDateStr) {
      if (!billDateStr) return { days: 0, level: 'normal', cardClass: '', badgeHtml: '<span class="aging-badge-normal">⏱️ 0 Days</span>' };
      try {
        const parts = String(billDateStr).split('-');
        let billDate;
        if (parts.length === 3) {
          billDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        } else {
          billDate = new Date(billDateStr);
        }
        if (isNaN(billDate.getTime())) return { days: 0, level: 'normal', cardClass: '', badgeHtml: '<span class="aging-badge-normal">⏱️ N/A</span>' };
        
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const d1 = new Date(billDate.getFullYear(), billDate.getMonth(), billDate.getDate());
        const diffDays = Math.max(0, Math.floor((today - d1) / (1000 * 60 * 60 * 24)));
        
        if (diffDays >= 15 && diffDays <= 25) {
          return {
            days: diffDays,
            level: 'yellow',
            cardClass: 'aging-card-yellow',
            badgeHtml: `<span class="aging-badge-yellow">🟡 Pending ${diffDays} Days</span>`
          };
        } else if (diffDays > 25) {
          return {
            days: diffDays,
            level: 'red',
            cardClass: 'aging-card-red',
            badgeHtml: `<span class="aging-badge-red">🔴 Overdue ${diffDays} Days</span>`
          };
        } else {
          return {
            days: diffDays,
            level: 'normal',
            cardClass: '',
            badgeHtml: `<span class="aging-badge-normal">⏱️ ${diffDays} Day${diffDays === 1 ? '' : 's'}</span>`
          };
        }
      } catch (_) {
        return { days: 0, level: 'normal', cardClass: '', badgeHtml: '<span class="aging-badge-normal">⏱️ 0 Days</span>' };
      }
    }

    async function loadBills() {
      const stored = localStorage.getItem('hcp_store_bills');
      if (stored) {
        try { bills = JSON.parse(stored); } catch (_) { bills = []; }
      }

      // Fetch from Supabase store_bills and store_vendor_payments
      try {
        const client = getSupabaseClient();
        if (client) {
          const [billsRes, paymentsRes] = await Promise.all([
            client.from('store_bills').select('*').order('created_at', { ascending: false }).limit(100),
            client.from('store_vendor_payments').select('*').order('paid_at', { ascending: false }).limit(300)
          ]);

          const allPayments = (paymentsRes && paymentsRes.data) ? paymentsRes.data : [];

          if (billsRes && billsRes.data && billsRes.data.length > 0) {
            const mapped = billsRes.data.map(b => {
              const v = vendors.find(x => x.id === b.vendor_id);
              const total = parseFloat(b.total_amount) || 0;
              let paid = parseFloat(b.paid_amount) || 0;
              let pending = (b.pending_amount !== undefined && b.pending_amount !== null) ? parseFloat(b.pending_amount) : Math.max(0, total - paid);
              
              // Attach matching payment installments
              const bPayments = allPayments.filter(p => Number(p.bill_id) === Number(b.id)).sort((p1, p2) => new Date(p1.paid_at) - new Date(p2.paid_at));
              
              // Reconcile paid and pending with payments if present
              if (bPayments.length > 0) {
                const totalFromPayments = bPayments.reduce((acc, p) => acc + (parseFloat(p.payment_amount) || 0), 0);
                if (totalFromPayments > paid) {
                  paid = totalFromPayments;
                  pending = Math.max(0, total - paid);
                }
              }

              // Determine status
              let billStatus = 'PENDING';
              const rawStatus = String(b.status || '').toUpperCase();
              if (pending === 0 || rawStatus === 'FULL' || rawStatus === 'PAID') {
                billStatus = 'FULL';
                pending = 0;
                paid = total;
              } else if (paid > 0 && pending > 0) {
                billStatus = 'PARTLY';
              } else {
                billStatus = 'PENDING';
                pending = total;
                paid = 0;
              }

              return {
                id: 'BILL-' + b.id,
                db_id: b.id,
                vendor_id: b.vendor_id,
                vendor_name: v ? v.name : ('Vendor #' + b.vendor_id),
                vendor_phone: v ? v.phone : '',
                bill_number: b.bill_number || 'N/A',
                bill_date: b.bill_date || '',
                amount: total,
                total_amount: total,
                paid_amount: paid,
                pending_amount: pending,
                amount_formatted: formatIndianNumber(total),
                has_gst: (b.notes || '').includes('With GST') || b.has_gst === 1,
                gst_status: ((b.notes || '').includes('With GST') || b.has_gst === 1) ? 'With GST' : 'Without GST',
                payment_mode: (b.notes || '').split('Mode: ')[1] || b.payment_mode || 'Bank Transfer',
                status: billStatus,
                created_at: b.created_at,
                payments: bPayments
              };
            });
            bills = mapped;
            saveBills();
            updateBillsCounter();
            renderBillsList();
            if (typeof currentRecentSubTab !== 'undefined' && currentRecentSubTab === 'party') {
              renderPartyWiseList();
            }
          }
        }
      } catch (e) {
        console.warn('Fetch bills note:', e);
      }
    }

    }

      const totalAmt = Number(b.amount || b.total_amount || 0);

      const s = String(b.status || '').toUpperCase();
      let pendingAmt = (b.pending_amount !== undefined && b.pending_amount !== null) ? Number(b.pending_amount) : Math.max(0, totalAmt - paidAmt);

      if (s === 'FULL' || s === 'PAID' || pendingAmt <= 0) {
        return {
          code: 'FULL',
          label: 'Fully',
          badgeClass: 'badge-status-fully',
          cardClass: 'status-card-full',

          pendingAmt: 0,

          code: 'PARTLY',
          label: 'Partially',
          badgeClass: 'badge-status-partially',
          cardClass: 'status-card-partly',
          color: '#b45309',
          pendingAmt: pendingAmt,
          paidAmt: paidAmt,
          totalAmt: totalAmt

        badgeClass: 'badge-status-pending',
        cardClass: 'status-card-unpaid',
        color: '#dc2626',

            itemsHtml += `
              <div class="installment-box">
                <div class="installment-header">
                  <span>${payments.length > 1 ? `Payment #${idx + 1}` : 'Payment Clearance'}</span>
                  <span class="installment-amount">₹${formatIndianNumber(p.payment_amount)}</span>
                </div>
                <div class="installment-row">
                  <span>Mode: <strong>${p.payment_mode || b.payment_mode}</strong></span>
                  <span>📅 ${formatDateTime(p.paid_at)}</span>
                </div>
                ${p.reference_no ? `<div class="installment-row"><span>Ref / Txn:</span><span>${p.reference_no}</span></div>` : ''}
                ${p.paid_by ? `<div class="installment-row"><span>Paid By:</span><span>${p.paid_by}</span></div>` : ''}
              </div>
            `;
          });
          installmentSectionHtml = `
            <div class="installments-container">
              <div class="installments-title">📋 Clearance Logs (${payments.length} Payment${payments.length > 1 ? 's' : ''})</div>
              ${itemsHtml}
            </div>
          `;
        } else {
          // Fallback if payments table empty
          installmentSectionHtml = `
            <div class="installments-container">
              <div class="installments-title">📋 Payment Clearance Details</div>
              <div class="installment-box">
                <div class="installment-header">
                  <span>Full Payment Cleared</span>
                  <span class="installment-amount">₹${formatIndianNumber(info.totalAmt)}</span>
                </div>
                <div class="installment-row">
                  <span>Payment Mode: <strong>${b.payment_mode}</strong></span>
                  <span>📅 ${formatDateTime(b.created_at)}</span>
                </div>
              </div>
            </div>
          `;
        }
      }

      content.innerHTML = `
        ${statusBannerHtml}
        <div class="detail-row">
          <span class="detail-label">Status</span>
          <span class="badge ${info.badgeClass}">${info.label}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Vendor Name</span>
          <span class="detail-value">${b.vendor_name}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Vendor Mobile</span>
          <span class="detail-value">${b.vendor_phone || 'N/A'}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Bill Number</span>
          <span class="detail-value">${b.bill_number}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Bill Date</span>
          <span class="detail-value">${b.bill_date}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Total Amount</span>
          <span class="detail-value" style="color:var(--gold-dark); font-size:15px; font-weight:800;">₹${b.amount_formatted}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">GST Option</span>
          <span class="detail-value">${b.gst_status}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Payment Mode</span>
          <span class="detail-value">${b.payment_mode}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Bill ID</span>
          <span class="detail-value" style="font-size:11px; color:#64748b;">${b.id}</span>
        </div>
        ${installmentSectionHtml}
      `;
      document.getElementById('billDetailsModal').classList.add('show');
    }

    // -------------------------------------------------------------
    // TABS & SUB-TABS (BILL WISE & PARTY WISE)
    // -------------------------------------------------------------
    
    let currentRecentSubTab = 'bill';

    function switchRecentSubTab(mode) {
      currentRecentSubTab = mode;
      document.getElementById('subTabBillBtn').classList.toggle('active', mode === 'bill');
      document.getElementById('subTabPartyBtn').classList.toggle('active', mode === 'party');
      document.getElementById('billsListContainer').style.display = (mode === 'bill') ? 'flex' : 'none';
      document.getElementById('partyListContainer').style.display = (mode === 'party') ? 'flex' : 'none';
      if (mode === 'party') {
        renderPartyWiseList();
      } else {
        renderBillsList();
      }
    }

    function togglePartyAccordion(element) {
      const card = element.closest('.party-group-card');
      if (card) {
        card.classList.toggle('open');
      }
    }

    function renderPartyWiseList() {
      const container = document.getElementById('partyListContainer');
      container.innerHTML = '';

      if (bills.length === 0) {
        container.innerHTML = '<div class="empty-state">No bills recorded yet.</div>';
        return;
      }

      // Group bills by Vendor / Party
      const parties = {};
      bills.forEach(b => {
        const vId = b.vendor_id || b.vendor_name || 'other';
        const vName = b.vendor_name || 'General Party';
        if (!parties[vId]) {
          parties[vId] = {
            id: vId,
            name: vName,
            phone: b.vendor_phone || '',
            bills: [],
            pendingBills: [],
            totalAmt: 0,
            paidAmt: 0,
            pendingAmt: 0
          };
        }
        parties[vId].bills.push(b);
        const info = getBillStatusInfo(b);
        const amt = Number(b.amount || 0);
        parties[vId].totalAmt += amt;
        parties[vId].paidAmt += info.paidAmt;
        parties[vId].pendingAmt += info.pendingAmt;
        if (info.pendingAmt > 0) {
          parties[vId].pendingBills.push(b);
        }
      });

      // User requirement: "if click party wise sould see the all party names & pending dues only"
      // Filter out parties that have 0 pending dues!
      const pendingParties = Object.values(parties).filter(p => p.pendingAmt > 0);

      if (pendingParties.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="padding: 30px 16px;">
            <div style="font-size: 32px; margin-bottom: 8px;">🎉</div>
            <div style="font-weight: 700; color: #047857; font-size: 15px;">All Party Bills Fully Cleared!</div>
            <div style="color: var(--text-muted); font-size: 12.5px; margin-top: 4px;">There are no pending dues across any vendors.</div>
          </div>
        `;
        return;
      }

      // Sort by largest pending due first
      pendingParties.sort((a, b) => b.pendingAmt - a.pendingAmt);

      pendingParties.forEach(party => {
        const pCard = document.createElement('div');
        pCard.className = 'party-group-card open'; // opened by default for quick inspection

        let billsHtml = '';
        party.pendingBills.forEach(b => {
          const info = getBillStatusInfo(b);
          const aging = getBillAging(b.bill_date || b.created_at);

          billsHtml += `
            <div class="bill-item-card ${aging.cardClass || info.cardClass}" onclick='openBillDetailsModal(${JSON.stringify(b).replace(/'/g, "&#39;")})' style="margin-bottom: 6px;">
              <div class="bill-card-top">
                <div>
                  <div style="font-weight: 700; font-size: 14px; color: var(--text);">Bill #: ${b.bill_number || 'N/A'}</div>
                  <div class="bill-meta">Date: ${b.bill_date} • Mode: ${b.payment_mode || 'Bank'}</div>
                  <div style="margin-top: 5px;">
                    ${aging.badgeHtml}
                  </div>
                </div>
                <div style="text-align: right;">
                  <div style="font-size: 11px; color: var(--text-muted);">Due Amount</div>
                  <div style="font-size: 16px; font-weight: 800; color: #dc2626;">₹${formatIndianNumber(info.pendingAmt)}</div>
                  <div style="font-size: 11px; color: var(--text-muted); margin-top: 1px;">Total: ₹${formatIndianNumber(b.amount)}</div>
                  <span class="badge ${info.badgeClass}" style="margin-top: 4px; display: inline-block;">${info.label}</span>
                </div>
              </div>
            </div>
          `;
        });

        pCard.innerHTML = `
          <div class="party-header" onclick="togglePartyAccordion(this)">
            <div class="party-title-wrap">
              <div class="party-title">${party.name}</div>
              <div class="party-sub">${party.phone ? '📞 ' + party.phone + ' • ' : ''}${party.pendingBills.length} Pending Bill${party.pendingBills.length > 1 ? 's' : ''}</div>
            </div>
            <div class="party-right-meta">
              <div class="party-due-pill">Due: ₹${formatIndianNumber(party.pendingAmt)}</div>
              <span class="party-toggle-arrow">▼</span>
            </div>
          </div>
          <div class="party-bills-list">
            ${billsHtml}
          </div>
        `;
        container.appendChild(pCard);
      });
    }

    // -------------------------------------------------------------
    // OFFLINE SYNC RESILIENCE ARCHITECTURE
    // -------------------------------------------------------------
    async function flushOfflineQueue() {
      const q = localStorage.getItem('hcp_store_offline_queue');
      if (!q) return;
      let items = [];
      try { items = JSON.parse(q); } catch (_) { items = []; }
      if (!items || items.length === 0) return;

      const client = getSupabaseClient();
      if (!navigator.onLine || !client) return;

      console.log('[Store Sync] Flushing offline bills queue (' + items.length + ' items)...');
      const unSynced = [];
      for (const item of items) {
        try {
          const vId = await getOrSyncVendorDbId({
            id: item.vendor_id,
            name: item.vendor_name,
            phone: item.vendor_phone,
            category: item.vendor_category
          });

          const { data: insData, error: insErr } = await client.from('store_bills').insert([{
            vendor_id: vId,
            bill_number: item.bill_number || 'N/A',
            bill_date: item.bill_date,
            total_amount: item.total_amount,
            paid_amount: 0,
            pending_amount: item.total_amount,
            status: 'PENDING',
            notes: item.notes,
            created_by: 'Store Boy (Offline Synced)'
          }]).select();

          if (insErr) throw insErr;
          
          const sBillId = (insData && insData[0]) ? insData[0].id : '';
          const syncPush = {
            title: '📦 Store Bill: ' + (item.vendor_name || 'Vendor'),
            body: '₹' + item.total_amount + ' bill synced from Storeman',
            type: 'store',
            data: { bill_id: String(sBillId), amount: item.total_amount, bill_number: item.bill_number }
          };
          client.functions.invoke('send-push', { body: syncPush }).catch(() => {
            client.functions.invoke('send-store-push', { body: syncPush }).catch(() => {});
          });
        } catch (e) {
          unSynced.push(item);
        }
      }

      localStorage.setItem('hcp_store_offline_queue', JSON.stringify(unSynced));
      if (unSynced.length === 0) {
        showToast('All offline bills synced to cloud ✓', true);
        loadBills();
      }
    }

    window.addEventListener('online', () => {
      showToast('Internet connected. Syncing bills...', true);
      flushOfflineQueue();
    });


    function switchTab(tab) {
      document.getElementById('tabAddBtn').classList.toggle('active', tab === 'add');
      document.getElementById('tabRecentBtn').classList.toggle('active', tab === 'recent');
      document.getElementById('tabAdd').classList.toggle('active', tab === 'add');
      document.getElementById('tabRecent').classList.toggle('active', tab === 'recent');
      if (tab === 'recent') {
        loadBills();
        if (typeof currentRecentSubTab !== 'undefined' && currentRecentSubTab === 'party') {
          renderPartyWiseList();
        } else {
          renderBillsList();
        }
      }
    }
    window.switchTab = switchTab;

    // Listen for notification messages or postMessage triggers
    window.addEventListener('message', (event) => {
      try {
        const d = (typeof event.data === 'string') ? JSON.parse(event.data) : event.data;
        if (d && (d.action === 'open_recent' || d.type === 'store_payment' || d.tab === 'recent')) {
          switchTab('recent');
        }
      } catch (_) {
        if (event.data === 'open_recent') switchTab('recent');
      }
    });

    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    function showToast(msg, isSuccess = true) {
      const box = document.getElementById('toastBox');
      document.getElementById('toastIcon').textContent = isSuccess ? '✓' : '⚠️';
      document.getElementById('toastMsg').textContent = msg;
      box.classList.add('show');
      setTimeout(() => box.classList.remove('show'), 2200);
    }
  </script>
